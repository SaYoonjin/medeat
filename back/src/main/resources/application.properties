spring.application.name=Medeat

mybatis.mapper-locations=classpath:mappers/*.xml
mybatis.type-aliases-package=com.medeat
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl

spring.datasource.url=${MEDEAT_DB_URL:jdbc:mysql://localhost:3306/medeat?serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${MEDEAT_DB_USERNAME:ssafy}
spring.datasource.password=${MEDEAT_DB_PASSWORD:ssafy}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=never

medeat.notification.batch.scheduler.enabled=${MEDEAT_NOTIFICATION_BATCH_ENABLED:false}
medeat.notification.batch.scheduler.cron=${MEDEAT_NOTIFICATION_BATCH_CRON:0 */5 * * * *}
medeat.notification.batch.scheduler.zone-id=${MEDEAT_NOTIFICATION_BATCH_ZONE_ID:Asia/Seoul}
medeat.notification.batch.scheduler.slot-minutes=${MEDEAT_NOTIFICATION_BATCH_SLOT_MINUTES:5}
medeat.notification.batch.send.max-attempts=${MEDEAT_NOTIFICATION_SEND_MAX_ATTEMPTS:3}
medeat.notification.batch.send.batch-size=${MEDEAT_NOTIFICATION_SEND_BATCH_SIZE:100}
medeat.notification.batch.send.lease-minutes=${MEDEAT_NOTIFICATION_SEND_LEASE_MINUTES:10}
medeat.notification.batch.send.worker-id=${MEDEAT_NOTIFICATION_SEND_WORKER_ID:}
medeat.notification.batch.retry.recovery-backoff-minutes=${MEDEAT_NOTIFICATION_RETRY_RECOVERY_BACKOFF_MINUTES:1}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

server.servlet.session.timeout=120m
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false

springdoc.api-docs.enabled=true

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.jackson.serialization.fail-on-empty-beans=false

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

medeat.storage.upload-dir=${MEDEAT_UPLOAD_DIR:C:/medeat/upload}

mfds.drug.base-url=${MFDS_DRUG_BASE_URL:https://apis.data.go.kr/1471000/DrugPrdtPrmsnInfoService07}
mfds.drug.service-key=${MFDS_DRUG_SERVICE_KEY:}
mfds.drug.cache-ttl-days=${MFDS_DRUG_CACHE_TTL_DAYS:30}

medeat.rag.chunk.size=${MEDEAT_RAG_CHUNK_SIZE:500}
medeat.rag.chunk.overlap=${MEDEAT_RAG_CHUNK_OVERLAP:50}
medeat.rag.indexing.batch-size=${MEDEAT_RAG_INDEXING_BATCH_SIZE:50}
medeat.rag.indexing.max-attempts=${MEDEAT_RAG_INDEXING_MAX_ATTEMPTS:3}
medeat.rag.indexing.lease-minutes=${MEDEAT_RAG_INDEXING_LEASE_MINUTES:10}
medeat.rag.indexing.retry-delay-minutes=${MEDEAT_RAG_INDEXING_RETRY_DELAY_MINUTES:5}
medeat.rag.search.top-k=${MEDEAT_RAG_SEARCH_TOP_K:5}

spring.ai.vectorstore.qdrant.host=${QDRANT_HOST:localhost}
spring.ai.vectorstore.qdrant.port=${QDRANT_GRPC_PORT:6334}
spring.ai.vectorstore.qdrant.api-key=${QDRANT_API_KEY:}
spring.ai.vectorstore.qdrant.collection-name=${QDRANT_COLLECTION_NAME:medeat_drug_rag}
spring.ai.vectorstore.qdrant.use-tls=${QDRANT_USE_TLS:false}
spring.ai.vectorstore.qdrant.initialize-schema=${QDRANT_INITIALIZE_SCHEMA:false}

pill.embed.python-path=${PILL_EMBED_PYTHON_PATH:C:/pill_embed_project/venv/Scripts/python.exe}
pill.embed.script-path=${PILL_EMBED_SCRIPT_PATH:C:/pill_embed_project/single_embed.py}
pill.embed.workdir=${PILL_EMBED_WORKDIR:C:/pill_embed_project}
pill.embed.encoding=${PILL_EMBED_ENCODING:utf-8}

spring.mail.host=${SPRING_MAIL_HOST:smtp.naver.com}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_SSL_TRUST:smtp.naver.com}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

project.mail.sender-name=${PROJECT_MAIL_SENDER_NAME:MEDEAT}

java.net.preferIPv4Stack=true

gms.base-url=${GMS_BASE_URL:https://gms.ssafy.io/gmsapi}
gms.api-key=${GMS_API_KEY:}
gms.timeout-ms=${GMS_TIMEOUT_MS:15000}
